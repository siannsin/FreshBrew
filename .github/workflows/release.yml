name: Release DMG

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Run tests
        run: |
          xcodebuild test \
            -project FreshBrew.xcodeproj \
            -scheme FreshBrew \
            -destination 'platform=macOS' \
            -derivedDataPath /private/tmp/freshbrew-derived-data \
            CODE_SIGNING_ALLOWED=NO

      - name: Build DMG
        run: ./script/build_dmg.sh "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          NOTES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE"' EXIT

          awk -v version="$VERSION" '
            BEGIN {
              header = "## [" version "]"
            }
            !found && ($0 == header || index($0, header " - ") == 1) {
              found = 1
              next
            }
            found && index($0, "## [") == 1 {
              exit
            }
            found {
              print
            }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [[ ! -s "$NOTES_FILE" ]] || ! grep -q '[^[:space:]]' "$NOTES_FILE"; then
            echo "No changelog section found for version $VERSION." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            "dist/FreshBrew-$VERSION-universal.dmg" \
            "dist/FreshBrew-$VERSION-universal.dmg.sha256" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$NOTES_FILE"
