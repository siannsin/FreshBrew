name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run tests
        run: |
          xcodebuild test \
            -project FreshBrew.xcodeproj \
            -scheme FreshBrew \
            -destination 'platform=macOS' \
            -derivedDataPath /private/tmp/freshbrew-derived-data \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release
        run: |
          xcodebuild build \
            -project FreshBrew.xcodeproj \
            -scheme FreshBrew \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath /private/tmp/freshbrew-release-derived-data \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

          lipo \
            /private/tmp/freshbrew-release-derived-data/Build/Products/Release/FreshBrew.app/Contents/MacOS/FreshBrew \
            -verify_arch arm64 x86_64

          lipo \
            /private/tmp/freshbrew-release-derived-data/Build/Products/Release/FreshBrew.app/Contents/Helpers/FreshBrewAskpass \
            -verify_arch arm64 x86_64
